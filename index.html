</style><title>Farol · Luces de navegación</title></head><body><header><a class="brand" href="#">✳ farol <small>CUADERNO DE<br>NAVEGACIÓN</small></a><nav><button data-page="guide" class="active">Consultar</button><button data-page="practice">Practicar ↗</button></nav><button id="night">◐ <span>Modo nocturno</span></button></header><main id="app"></main><footer><span>FAROL &nbsp; / &nbsp; Aprende. Reconoce. Navega.</span><span id="connection">● Preparando modo sin conexión</span></footer><dialog id="detail"></dialog><script>const $=s=>document.querySelector(s);const colors={R:'#ff5559',G:'#5ef09b',W:'#fff5d8',Y:'#ffdc67'};
const categories=['Motor','Remolque','Vela','Pesca','Especiales','Fondeo','Básicas'];

function buildCatalogue(){
 const out=[];

 const anchor=(big=false,deck=false)=>[L('W','all',0,85,60),...(big?[L('W','all',0,58,-60)]:[]),...(deck?[L('D','deck',0,13,0)]:[])];
 const tow=(long=false,big=false,push=false)=>[...[...('W'.repeat(long?3:2))].map((c,i)=>L(c,'mast',0,108-i*22,45)),...(big?[L('W','mast',0,140,-45)]:[]),...sail(),...(!push?[L('Y','stern',0,44,-65)]:[])];
 const S=(shape,x=0,z=80,y=0)=>({shape,x,z,y});
 const markStack=shapes=>shapes.map((s,i)=>S(s,0,108-i*30));
 const add=(id,name,cat,rule,clause,lights,desc,extra={})=>out.push({id,name,sub:extra.sub||'Configuración reglamentaria',cat,rule,clause,lights,desc,kind:'lights',view:extra.view||'proa',...extra});
 const mark=(id,name,cat,rule,clause,shapes,desc)=>out.push({id,name,cat,rule,clause,shapes,desc,kind:'marks',view:'proa',sub:'Señal diurna · marcas negras salvo bandera Alfa'});
 const theory=(id,name,rule,clause,desc,prompt,correct,wrong)=>out.push({id,name,cat:'Básicas',rule,clause,desc,prompt,correct,wrong,kind:'theory',sub:'Concepto o excepción · sin patrón luminoso exclusivo',view:'proa'});
 const ram=()=>stack('RWR',-28);
 const nuc=()=>stack('RR');
 const fishMark=()=>[S('fishing')];
 const ramMarks=()=>markStack(['ball','diamond','ball']);
 // 23: ordinary arrangements, small craft and additional flashing signals.
 for(const big of [false,true]){
  add(big?'motor50':'motor',big?'Motor · 50 m o más':'Motor · menos de 50 m','Motor',23,'a)',motor(big),'Tope blanco a proa, costados y alcance. '+(big?'Segundo tope a popa y más alto obligatorio.':'El segundo tope a popa y más alto es facultativo.'),{sub:'En navegación · disposición general'});
  add('hover'+big,'Aerodeslizador · '+(big?'50 m o más':'menos de 50 m'),'Motor',23,'b)',[...motor(big),L('Y','all',-35,75,0,true)],'En condición sin desplazamiento añade una amarilla de centelleos todo horizonte a las luces de motor.',{sub:'Sin desplazamiento · amarilla de centelleos'});
  add('wig'+big,'Vuelo rasante · '+(big?'50 m o más':'menos de 50 m'),'Motor',23,'c)',[...motor(big),L('R','all',-35,75,0,true)],'Al despegar, aterrizar o volar cerca de la superficie añade una roja centelleante todo horizonte de gran intensidad.',{sub:'Despegue, aterrizaje o vuelo próximo a la superficie'});
 }
 add('motor-optional','Motor menor de 50 m · segundo tope facultativo','Motor',23,'a) ii)',motor(true),'Un buque menor de 50 m puede llevar el segundo tope. Dos topes no demuestran por sí solos que alcance 50 m.');
 add('small','Motor menor de 12 m · blanca todo horizonte','Motor',23,'d) i)',[L('W'),...sides()],'Alternativa: blanca todo horizonte y luces de costado; la blanca sustituye al tope y al alcance.');
 add('slow7','Motor menor de 7 m · máximo 7 nudos','Motor',23,'d) ii)',[L('W')],'Puede mostrar una blanca todo horizonte y, si es posible, costados. Esta ficha representa el supuesto sin costados por no ser posible.');
 add('slow7-sides','Motor menor de 7 m · con costados','Motor',23,'d) ii)',[L('W'),...sides()],'Máximo 7 nudos: blanca todo horizonte y, si es posible, costados.');
 add('small-offset','Motor menor de 12 m · blanca descentrada','Motor',23,'d) iii)',[L('W','all',-22,90),L('G','star',0,22),L('R','port',0,22)],'Si no es posible centrar el tope o la blanca todo horizonte, puede apartarse del eje; los costados deben ir combinados y alineados lo más cerca posible con dicha luz.');
 // 24: length of tow and length of tug are independent thresholds.
 for(const big of [false,true])for(const long of [false,true]){
  const suffix=(big?' ≥50 m':' <50 m')+' · remolque '+(long?'>200 m':'≤200 m');
  add('tow-'+big+'-'+long,'Remolcador'+suffix,'Remolque',24,'a), d)',tow(long,big),'Dos topes verticales, o tres si el remolque supera 200 m; costados, alcance y amarilla sobre el alcance. '+(big?'Por su eslora, añade el segundo tope de la regla 23(a)(ii).':'Puede llevar también el segundo tope facultativo de la regla 23(a)(ii).')+' La longitud del remolque se mide desde la popa del remolcador hasta el extremo de popa del remolque.');
  add('restricted-tow-'+big+'-'+long,'Remolque con maniobra muy restringida'+suffix,'Remolque',27,'c)',[...tow(long,big),...stack('RWR',-45,100)],'Además de las luces de remolque de la regla 24(a), roja-blanca-roja todo horizonte cuando la operación restringe en extremo la capacidad del remolcador y del remolque para apartarse de su derrota. Marcas: bola-bicónica-bola y bicónica de remolque si supera 200 m.');
 }
 for(const big of [false,true]){
  for(const task of ['Empujador sin unión rígida','Remolcador por el costado'])add('push-'+big+'-'+task,task+' · '+(big?'50 m o más':'menos de 50 m'),'Remolque',24,'c), d)',tow(false,big,true),'Dos topes blancos verticales, costados y alcance, sin amarilla de remolque. '+(big?'Añade el segundo tope de la regla 23(a)(ii).':'El segundo tope longitudinal es facultativo.'));
  add('rigid'+big,'Unidad compuesta rígida · '+(big?'50 m o más':'menos de 50 m'),'Remolque',24,'b)',motor(big),'Empujador y empujado unidos rígidamente se consideran un único buque a motor y muestran las luces de la regla 23.');
 }
 for(const long of [false,true])add('towed'+long,'Buque remolcado · remolque '+(long?'>200 m':'≤200 m'),'Remolque',24,'e)',sail(),'Costados y alcance, sin luz de tope. '+(long?'Debe llevar además una bicónica.':'La bicónica no se exige por esta longitud.')+' No confundir el remolcado con el remolcador.');
 add('towed-side','Buque remolcado por el costado','Remolque',24,'f) ii)',sail(),'Alcance y luces de costado en el extremo de proa. Los grupos se iluminan como un solo buque.');
 add('pushed','Buque empujado sin unidad rígida','Remolque',24,'f) i)',sides(),'Luces de costado en el extremo de proa. No se prescribe luz de alcance para este buque empujado; los grupos se iluminan como un solo buque.');
 for(const wide of [false,true])for(const long of [false,true]){
  const lights=[L('W','all',0,26,65),L('W','all',0,26,-65),...(wide?[L('W','all',-45,26),L('W','all',45,26)]:[]),...(long?[L('W','all',0,26,0)]:[])];
  add('submerged-'+wide+'-'+long,'Objeto semisumergido · ancho '+(wide?'≥25 m':'<25 m')+' · largo '+(long?'>100 m':'≤100 m'),'Remolque',24,'g)',lights,'Objeto remolcado poco visible y parcialmente sumergido: blancas todo horizonte en sus extremos de proa y popa. '+(wide?'Añade blancas en los extremos de su anchura. ':'')+(long?'Añade blancas intermedias para que ninguna separación exceda 100 m; el dibujo representa un solo intervalo intermedio. ':'')+'Bicónica en el extremo popel; otra cerca del extremo proel si el remolque supera 200 m.',{view:'estribor',sub:'Blancas todo horizonte · cantidad intermedia según dimensiones'});
 }
 add('dracone','Dragón remolcado · blanco popel','Remolque',24,'g) i)',[L('W','all',0,26,-65)],'El dragón (recipiente flexible remolcado) no tiene que mostrar la blanca del extremo de proa. Se mantienen las demás señales que correspondan a sus dimensiones.');
 // 25: tricolour at masthead cannot coexist with red over green.
 add('vela','Velero · costados y alcance','Vela',25,'a)',sail(),'Solo a vela: costados y alcance, sin luz de tope blanca.');
 add('tricolour','Velero menor de 20 m · tricolor en el palo','Vela',25,'b)',[L('G','star',2,110),L('R','port',-2,110),L('W','stern',0,110)],'Puede reunir costados y alcance en un farol combinado en el tope del palo o cerca. No puede combinarse con la roja sobre verde facultativa.');
 add('sail-rg','Velero · roja sobre verde facultativas','Vela',25,'c)',[...stack('RG'),...sail()],'Roja sobre verde todo horizonte, además de costados y alcance separados. Nunca junto con la linterna tricolor de la regla 25(b).');
 add('sail-torch','Velero menor de 7 m · blanca de aviso','Vela',25,'d) i)',[L('W','all',0,50)],'Si no muestra las luces de vela por no ser posible, debe tener a mano una linterna o farol blanco y exhibirlo con tiempo suficiente para evitar el abordaje. El dibujo representa el momento de exhibición, no una luz fija continua.',{sub:'Linterna exhibida para evitar el abordaje'});
 add('oars','Embarcación a remo · blanca de aviso','Vela',25,'d) ii)',[L('W','all',0,50)],'Puede mostrar las luces de vela o disponer de linterna o farol blanco listo para exhibir con tiempo suficiente. No es una luz todo horizonte fija obligatoria.',{sub:'Momento de exhibición de la linterna'});
 add('oars-sail','Embarcación a remo · luces de vela','Vela',25,'d) ii)',sail(),'Una embarcación a remo puede exhibir el conjunto de luces de vela.');
 add('sail-motor','Velero propulsado también a motor','Vela',25,'e) / 23',motor(false),'Al usar el motor es buque de propulsión mecánica y muestra las luces de motor que correspondan a su eslora. De día, cono con vértice hacia abajo.');
 // 26: fishing lights apply when fishing underway or at anchor, not while merely travelling.
 for(const moving of [false,true])for(const big of [false,true]){
  add('trawl-'+moving+'-'+big,'Arrastrero · '+(big?'50 m o más':'menos de 50 m')+' · '+(moving?'con arrancada':'sin arrancada'),'Pesca',26,'a), b)',[...stack('GW'),...(big?[L('W','mast',0,140,-55)]:[]),...(moving?sail():[])],'Verde sobre blanca todo horizonte. '+(big?'Tope a popa y más alto que la verde obligatorio.':'El tope a popa más alto que la verde es facultativo.')+' '+(moving?'Añade costados y alcance por llevar arrancada.':'Sin arrancada no añade costados ni alcance.')+' Faenando fondeado usa estas señales de pesca, no las luces de fondeo de la regla 30.');
  if(!big)add('trawl-opt-'+moving,'Arrastrero menor de 50 m · tope facultativo · '+(moving?'con arrancada':'sin arrancada'),'Pesca',26,'b) ii)',[...stack('GW'),L('W','mast',0,140,-55),...(moving?sail():[])],'El tope a popa y por encima de la verde puede llevarse también por debajo de 50 m. '+(moving?'Con arrancada se añaden costados y alcance.':'Sin arrancada no se añaden costados ni alcance.'));
 }
 for(const moving of [false,true]){
  add('fish-'+moving,'Pesca no de arrastre · '+(moving?'con arrancada':'sin arrancada'),'Pesca',26,'a), c)',[...stack('RW'),...(moving?sail():[])],'Roja sobre blanca todo horizonte y marca de dos conos unidos por sus vértices. '+(moving?'Con arrancada añade costados y alcance.':'Sin arrancada no añade costados ni alcance.')+' Las señales de pesca se mantienen cuando faena fondeado.');
  for(const side of [-1,1])add('gear-'+moving+'-'+side,'Pesca · aparejo >150 m por '+(side<0?'babor':'estribor')+' · '+(moving?'con arrancada':'sin arrancada'),'Pesca',26,'c) ii)',[...stack('RW'),L('W','all',side*60,65),...(moving?sail():[])],'Además de roja sobre blanca, una blanca todo horizonte en dirección al aparejo que se extiende más de 150 m horizontalmente. De día, cono con vértice hacia arriba en esa dirección. '+(moving?'Añade costados y alcance.':'No lleva costados ni alcance sin arrancada.'));
 }
 add('fisher-transit','Pesquero que no está faenando','Pesca',26,'e)',motor(false),'Cuando no está dedicado a la pesca no muestra las señales de faena: usa las luces y marcas de su tipo y eslora. Se representa un motor menor de 50 m.');

 for(const moving of [false,true])add('nuc-'+moving,'Sin gobierno · '+(moving?'con arrancada':'sin arrancada'),'Especiales',27,'a)',[...nuc(),...(moving?sail():[])],'Dos rojas todo horizonte y dos bolas verticales. '+(moving?'Con arrancada añade costados y alcance, sin tope blanco.':'Sin arrancada no añade costados ni alcance.')+' Los menores de 12 m están exentos de estas señales salvo los dedicados a buceo.');
 add('ram-stop','Maniobra restringida · sin arrancada','Especiales',27,'b) i), ii)',ram(),'Roja-blanca-roja todo horizonte; de día bola-bicónica-bola. Sin arrancada y sin fondear no añade las luces de navegación ni de fondeo.');
 for(const big of [false,true]){

 theory('t20','Cuándo mostrar luces y marcas',20,'a)–e)','Las reglas se cumplen con cualquier tiempo. Luces desde la puesta hasta la salida del sol; también de día con visibilidad reducida, si se llevan. Las marcas se muestran de día. Otras luces no deben confundirse con las reglamentarias ni perjudicar su visibilidad o la vigilancia.','¿Cuándo deben mostrarse también de día las luces reglamentarias, si se llevan?','Con visibilidad reducida',['Solo al entrar en puerto','Solo si hay otros buques a la vista','Nunca durante el día']);
 theory('t21mast','Luz de tope · sector',21,'a)','Blanca, 225°, desde proa hasta 22,5° a popa del través por cada banda.','¿Qué sector cubre la luz de tope?','225°',['135°','112,5°','360°']);
 theory('t21side','Luces de costado · sectores',21,'b)','Verde a estribor y roja a babor; 112,5° cada una. En menores de 20 m pueden combinarse en un farol en el eje longitudinal.','¿Cuál es el sector de cada luz de costado?','112,5°',['225°','135°','180°']);
 theory('t21stern','Alcance y remolque · sectores',21,'c), d)','Alcance blanco y remolque amarillo: 135°, centrados hacia popa. La amarilla de remolque no es todo horizonte.','¿Qué distingue la luz de remolque de la de alcance?','Es amarilla; ambas cubren 135°',['Es roja y cubre 360°','Es blanca y cubre 225°','Es verde y cubre 112,5°']);
 theory('t21all','Luz todo horizonte y centelleos',21,'e), f)','Una todo horizonte abarca 360°. Una luz de centelleos produce al menos 120 centelleos por minuto.','¿Cuál es la frecuencia mínima de una luz de centelleos?','120 por minuto',['60 por minuto','30 por minuto','Una por segundo']);
 theory('t23offset','Pequeños motores · posición de luces',23,'d) iii)','Si no puede centrarse el tope o la blanca todo horizonte en un motor menor de 12 m, puede desplazarse del eje con los costados combinados y alineados lo más cerca posible con ella.','¿En qué buques se permite esta alternativa de luz blanca descentrada?','Motores de menos de 12 m, con las condiciones de la regla 23(d)(iii)',['En cualquier eslora sin condiciones','Solo en buques de más de 50 m','Solo en veleros con linterna tricolor']);
 theory('t24rigid','Empuje con conexión rígida',24,'b)','Una unidad compuesta rígida se considera un solo buque de propulsión mecánica. No usa las dos luces verticales de empuje de la regla 24(c).','¿Cómo se ilumina una unidad compuesta rígida?','Como un buque de propulsión mecánica',['Con tres verdes todo horizonte','Solo con una amarilla','Siempre con dos topes verticales de empuje']);
 theory('t24group','Grupos empujados o al costado',24,'f)','Cualquiera que sea su número, los grupos empujados o remolcados por el costado se iluminan como un solo buque.','¿Cómo deben iluminarse varios buques empujados en grupo?','Como un solo buque',['Cada uno con tres luces de tope','Solo el último con una verde','Sin ninguna luz']);
 theory('t24h','Remolcado que no puede exhibir señales',24,'h)','Si por causa justificada no puede mostrar las luces o marcas de los apartados e) o g), se toman todas las medidas posibles para iluminarlo o indicar al menos su presencia.','Si el remolcado no puede exhibir las señales por causa justificada, ¿qué procede?','Iluminarlo o indicar al menos su presencia por todos los medios posibles',['No indicar su presencia','Mostrar una roja de centelleos como sustitución general','Usar tres verdes de minas']);
 theory('t24i','Remolque excepcional de auxilio',24,'i)','Un buque no dedicado normalmente al remolque que por causa justificada no pueda mostrar las luces de remolcador, al ayudar a otro en peligro o necesitado de ayuda, debe indicar por todos los medios posibles la conexión, especialmente iluminando el cable.','Si un buque no dedicado normalmente al remolque no puede mostrar las luces de remolcador al auxiliar a otro en peligro, ¿qué debe indicar?','La conexión entre los buques, en particular iluminando el cable',['Que el remolcado es un pesquero','Únicamente la eslora del remolcador','Nada: no tiene ninguna obligación']);
 theory('t25comb','Tricolor y roja sobre verde',25,'b), c)','La roja sobre verde facultativa no puede exhibirse junto con la linterna tricolor combinada de un velero menor de 20 m.','¿Puede un velero llevar a la vez tricolor y roja sobre verde?','No',['Sí, siempre','Sí, si mide menos de 7 m','Solo estando fondeado']);
 theory('t25torch','Veleros pequeños y remos',25,'d)','La linterna blanca se muestra con tiempo para evitar abordajes. No equivale a exigir una blanca fija continua a todos los veleros menores de 7 m o embarcaciones a remo.','En un velero menor de 7 m o una embarcación a remo que utiliza la linterna blanca como alternativa, ¿cuándo debe exhibirla?','Se exhibe con tiempo suficiente para evitar el abordaje',['Solo después de una colisión','Como luz roja intermitente','Siempre apagada aunque otro buque se acerque']);
 theory('t26anchor','Pesca faenando fondeado',26,'a)','Cuando está dedicado a la pesca, tanto en navegación como fondeado, muestra solo las luces y marcas prescritas en la regla 26.','Un buque dedicado a la pesca que está fondeado, ¿añade las luces de fondeo de la regla 30?','No; muestra las prescritas por la regla 26',['Sí, siempre','Solo añade una roja intermitente','Sustituye las señales de pesca por las de motor']);
 theory('t26not','Pesquero sin faenar',26,'e)','Sin faenar usa las señales de su tipo y eslora, no las luces de pesca. Las señales adicionales de pesca en proximidad del anexo II no forman parte del temario PER.','Un pesquero que no está faenando, ¿qué señales muestra?','Las de su tipo y eslora',['Siempre roja sobre blanca','Siempre verde sobre blanca','Las de buque sin gobierno']);
 theory('t27small','Exención de menores de 12 m',27,'g)','Los menores de 12 m no están obligados a las luces y marcas de la regla 27, salvo los dedicados a operaciones de buceo.','¿Qué actividad impide aplicar la exención de luces y marcas de la regla 27 para menores de 12 m?','Operaciones de buceo',['Pesca deportiva','Navegación a vela','Transporte de pasajeros']);
 theory('t27anchor','Dragado fondeado',27,'d) iii)','El dragado con obstrucción usa sus señales específicas en lugar de las luces y marcas de fondeo. No se trata como la maniobra restringida general fondeada.','Un buque de dragado fondeado con obstrucción muestra…','Las señales de la regla 27(d), en lugar de las de fondeo',['Solo una bola de fondeo','Solo costados y alcance','Las señales de minas']);
 theory('t27alfa','Alfa en buceo reducido',27,'e)','Bandera Alfa rígida de al menos un metro de altura, visible todo horizonte, junto con roja-blanca-roja cuando no cabe la señalización completa del apartado d).','¿Qué bandera exige la regla 27(e)?','Alfa rígida de al menos 1 m de altura',['Bravo flexible de 20 cm','Una bandera verde lisa','La bandera de práctico']);
 theory('t27danger','Señales especiales y socorro',27,'h)','Las señales de sin gobierno y maniobra restringida no son señales de peligro que soliciten ayuda; las de peligro se encuentran en el anexo IV.','¿Las señales de la regla 27 equivalen por sí mismas a pedir auxilio?','No; las de peligro están en el anexo IV',['Sí, todas piden remolque','Sí, todas piden asistencia médica','Solo las tres verdes']);
 theory('t28optional','Señal de calado facultativa',28,'','Las tres rojas o el cilindro son facultativos y se añaden a la señalización que corresponde al buque a motor.','¿Las tres rojas por calado sustituyen las luces de motor?','No; son una señal adicional facultativa',['Sí, eliminan todos los topes','Sí, eliminan los costados','Solo sustituyen la luz de alcance']);
 theory('t29off','Práctico fuera de servicio',29,'b)','Fuera del servicio de practicaje muestra las señales de su tipo y eslora; no la blanca sobre roja de servicio.','¿Qué muestra un práctico cuando no está en servicio?','Las señales de su tipo y eslora',['Siempre blanca sobre roja','Roja sobre verde','Tres rojas de calado']);
 theory('t30deck','Alumbrado de cubierta fondeado',30,'c)','Puede iluminarse la cubierta estando fondeado; en buques de 100 m o más es obligatorio.','¿Desde qué eslora es obligatorio iluminar las cubiertas estando fondeado?','100 m',['50 m','12 m','200 m']);
 theory('t30seven','Fondeado menor de 7 m · exención',30,'e)','No tiene obligación de las señales de fondeo si está en un lugar que no esté dentro ni cerca de canal angosto, paso, fondeadero o zona de navegación frecuente. No es una exención general por tamaño.','¿Está un fondeado menor de 7 m siempre exento de luces y marca?','No; depende del lugar donde esté fondeado',['Sí, en cualquier sitio','Solo si mide más de 50 m','Solo de noche y nunca de día']);
 theory('t30twelve','Varado menor de 12 m · exención',30,'f)','No se le exigen las dos rojas ni las tres bolas específicas de varado; ello no elimina las demás obligaciones aplicables de la regla 30.','¿De qué señales específicas está exento un varado menor de 12 m?','De las dos rojas y las tres bolas de varado',['De toda señal sin condiciones','De los topes de remolque únicamente','Solo de la luz verde']);
 theory('t31','Hidroaviones y naves de vuelo rasante',31,'','Si no es posible exhibir las luces y marcas con las características o posiciones prescritas, deben exhibir las más parecidas posible. La regla 31 no crea una combinación de colores exclusiva para identificar hidroaviones.','¿Qué exige la regla 31 si no pueden ajustarse a las luces y marcas prescritas?','Las más parecidas posible en características y posición',['Una combinación exclusiva de tres amarillas','No llevar ninguna señal','Únicamente una luz de aeronave sin atender al RIPA']);
 for(const big of [false,true])for(const moving of [false,true])add('dredge-clear-'+big+'-'+moving,'Dragado sin obstrucción · '+(moving?'con arrancada':'sin arrancada')+' · '+(big?'≥50 m':'<50 m'),'Especiales',27,'d)',[...ram(),...(moving?motor(big):[])],'Sin obstrucción adicional muestra roja-blanca-roja y las marcas de maniobra restringida. Con arrancada añade las luces de motor; las señales laterales de obstrucción y paso se añaden cuando existe obstrucción.');
 theory('t21small','Costados combinados en menores de 20 m',21,'b)','Las luces de costado de menores de 20 m pueden ir combinadas en un farol en el eje longitudinal. La combinación no cambia sus colores ni sus sectores.','¿Puede un motor de 15 m llevar los costados en un farol combinado?','Sí, en el eje longitudinal',['No, solo los veleros','Solo si está fondeado','Solo si el farol emite una blanca']);
 theory('t23small','Segundo tope por debajo de 50 m',23,'a) ii)','Por debajo de 50 m el segundo tope no es obligatorio, pero puede llevarse. Su presencia no permite afirmar de forma inequívoca que el buque mida 50 m o más.','Dos luces de tope longitudinales, ¿demuestran siempre una eslora de 50 m o más?','No; el segundo tope es facultativo en menores de 50 m',['Sí, sin excepciones','Sí, si se ven desde un costado','Solo si el buque es un velero']);

function visibleLights(d,view=d.view){
 const angle=angleOf(view),a=angle*Math.PI/180,forward=angle<=112.5||angle>=247.5,aft=angle>112.5&&angle<247.5;
 const projected=(d.lights||[]).filter(l=>l.sector==='all'||l.sector==='deck'||l.sector==='mast'&&forward||l.sector==='stern'&&aft||l.sector==='star'&&angle<=112.5||l.sector==='port'&&(angle===0||angle>=247.5)).map(l=>({...l,x:160-l.x*Math.cos(a)+l.y*Math.sin(a)*.55,y:150-l.z}));
 // Separate lamps that coincide in an orthographic view so a teaching diagram remains legible.
 const groups=[];for(const l of projected){let group=groups.find(g=>Math.hypot(g[0].x-l.x,g[0].y-l.y)<12);if(!group){group=[];groups.push(group)}group.push(l)}
 for(const group of groups)if(group.length>1){const center=group.reduce((v,l)=>v+l.x,0)/group.length;group.forEach((l,i)=>l.x=center+(i-(group.length-1)/2)*13)}
 return projected;
}
function lightSignature(d,view){
 // Conservative comparison: don't use the exact distances between lights to reject a compatible type.
 const rows=new Map();for(const l of visibleLights(d,view)){const y=Math.round(l.y);if(!rows.has(y))rows.set(y,[]);rows.get(y).push(l.c+(l.blink?'*':''))}
 return [...rows].sort((a,b)=>a[0]-b[0]).map(([,cs])=>cs.sort().join(',')).join('|');
}
function markSignature(d){return (d.shapes||[]).map(s=>s.shape).sort().join('|')}
function patternSignature(d,view){return d.kind==='marks'?markSignature(d):lightSignature(d,view)}
function shapeSVG(s,view=0){
 const a=angleOf(view)*Math.PI/180,x=160-s.x*Math.cos(a)+s.y*Math.sin(a)*.55,y=150-s.z,fill='#10191d';
 const poly=pts=>'<polygon points="'+pts.map(([dx,dy])=>(x+dx)+','+(y+dy)).join(' ')+'" fill="'+fill+'"/>';
 if(s.shape==='ball')return '<circle cx="'+x+'" cy="'+y+'" r="9" fill="'+fill+'"/>';
 if(s.shape==='diamond')return poly([[0,-14],[11,0],[0,14],[-11,0]]);
 if(s.shape==='coneUp')return poly([[0,-13],[12,10],[-12,10]]);
 if(s.shape==='coneDown')return poly([[-12,-10],[12,-10],[0,13]]);
 if(s.shape==='fishing')return poly([[-13,-22],[13,-22],[0,0]])+poly([[0,0],[13,22],[-13,22]]);
 if(s.shape==='cylinder')return '<rect x="'+(x-10)+'" y="'+(y-19)+'" width="20" height="38" fill="'+fill+'"/>';
 if(s.shape==='alfa')return '<path d="M'+(x-32)+' '+(y-22)+'h64l-14 22 14 22h-64z" fill="#1765a0" stroke="#243a42"/><path d="M'+(x-32)+' '+(y-22)+'h25v44h-25z" fill="white"/>';
 return '';
}
function scene(d,view=d.view,practice=false){
 if(d.kind==='theory')return '<div class="theory-scene"><span>§ '+d.rule+'</span><small>REGLAS Y EXCEPCIONES</small></div>';
 const day=d.kind==='marks',label={proa:'VISTA DE PROA',popa:'VISTA DE POPA',babor:'COSTADO DE BABOR',estribor:'COSTADO DE ESTRIBOR'}[view]||'';
 const lights=visibleLights(d,view),names={R:'roja',G:'verde',W:'blanca',Y:'amarilla',D:'alumbrado de cubierta'};
 const desc=day?'Marcas observadas: '+d.shapes.map(s=>({ball:'bola',diamond:'bicónica',coneDown:'cono vértice abajo',coneUp:'cono vértice arriba',fishing:'dos conos por sus vértices',cylinder:'cilindro',alfa:'bandera Alfa'}[s.shape])).join(', '):'Luces observadas: '+lights.map(l=>names[l.c]+(l.blink?' de centelleos':'')).join(', ');
 const drawn=day?d.shapes.map(s=>shapeSVG(s,view)).join(''):lights.map(l=>l.c==='D'?'<ellipse cx="'+l.x+'" cy="'+l.y+'" rx="55" ry="8" fill="#f9e7ab" opacity=".25"/>':'<g'+(l.blink?' class="flashing"':'')+'>'+light(l.x,l.y,l.c)+'</g>').join('');
 return '<div class="scene '+(day?'day-scene':'')+'"><svg viewBox="0 0 320 180" role="img" aria-label="'+desc+'">'+drawn+'</svg>'+(!practice?'<span class="scene-label">'+(day?'MARCAS DIURNAS':label)+'</span>':'')+(lights.some(l=>l.blink)?'<span class="flash-label">Centelleos</span>':'')+'</div>';
}
const compatibilityIndex=new Map();
function compatibleMatches(d,bearing){
 if(!compatibilityIndex.has(d.kind)){
  const index=new Map();for(const item of data.filter(x=>x.kind===d.kind)){
   const signatures=new Set(item.kind==='marks'?[markSignature(item)]:bearings.filter(a=>visibleLights(item,a).length).map(a=>lightSignature(item,a)));
   for(const sig of signatures){if(!index.has(sig))index.set(sig,[]);index.get(sig).push(item)}
  }
  compatibilityIndex.set(d.kind,index);
 }
 return compatibilityIndex.get(d.kind).get(patternSignature(d,bearing))||[];
}

function practiceCandidates(cat,kind){return data.filter(d=>d.kind===kind&&(cat==='Todas'||d.cat===cat))}
function makeQuestionOptions(d,bearing){
 if(d.kind==='theory')return {matches:[d],expected:d.id,options:shuffle([{id:d.id,name:d.correct},...d.wrong.map((name,i)=>({id:d.id+'-wrong-'+i,name}))])};
 const matches=compatibleMatches(d,bearing),compatibleIds=new Set(matches.map(x=>x.id));
 const wrong=shuffle(data.filter(x=>x.kind===d.kind&&!compatibleIds.has(x.id))).slice(0,3);
 return {matches,expected:d.id,options:shuffle([d,...wrong])};
}

function coverage(){return '<details class="coverage"><summary>Cobertura del PER · reglas, variantes y excepciones</summary><p>El temario define reglas, no una cantidad cerrada de dibujos. El catálogo agrupa situaciones con la misma señal y separa las variantes que cambian las luces o marcas. Las cantidades de luces intermedias y el alumbrado de cubierta se explican según las dimensiones; no se enumeran infinitas esloras o posiciones.</p><div class="coverage-grid">'+[
 [20,'Aplicación de luces y marcas, visibilidad reducida y otras luces'],[21,'Tope, costados, alcance, remolque, todo horizonte y centelleos'],[23,'Motor por eslora, segundo tope facultativo, pequeños motores, aerodeslizador y vuelo rasante'],[24,'Remolque por longitud y eslora; empuje, costado, unidad rígida, remolcados y semisumergidos; auxilio e imposibilidad'],[25,'Vela, tricolor, roja sobre verde, remos, linterna y motor con vela'],[26,'Arrastre y otras artes, eslora, arrancada, fondeo, aparejo >150 m y fuera de faena'],[27,'Sin gobierno, maniobra restringida, remolque muy restringido, dragado, buceo, minas y exenciones'],[28,'Calado: tres rojas o cilindro facultativos y luces de motor'],[29,'Práctico en servicio, navegación, fondeo y fuera de servicio'],[30,'Fondeo y varado, esloras, cubierta y excepciones de menores de 7 / 12 m'],[31,'Hidroaviones y vuelo rasante: señales lo más parecidas posible; no patrón exclusivo']
 ].map(([r,text])=>'<p><a href="'+BOE+'#regla'+r+'" target="_blank" rel="noopener">Regla '+r+' ↗</a><br>'+text+'</p>').join('')+'</div><p>Revisión de contenido: 4 de noviembre de 2026. El anexo II de señales adicionales de pesca no se incorpora a los ejercicios: está excluido del PER. Las reglas 32–37, el anexo IV y el balizamiento IALA se estudian en otros apartados del temario y no son objeto de este catálogo de luces y marcas.</p></details>'}
function note(){return '<div class="note">PER · UT 6.3: reglas 20, 21 y 23–31. Luces, marcas y excepciones; la regla 22 y los anexos I, II y III están excluidos del temario. Esquemas didácticos, sin escala: las posiciones pueden variar y las blancas intermedias dependen de las dimensiones. La app no es un banco oficial de preguntas ni cubre el resto del examen PER. <a href="https://www.boe.es/buscar/act.php?id=BOE-A-2014-10344#aii" target="_blank" rel="noopener">Temario oficial ↗</a> · <a href="'+BOE+'#partec" target="_blank" rel="noopener">RIPA en el BOE ↗</a>. No sustituye la vigilancia ni el Reglamento.</div>'}

function guide(){
 $('#app').innerHTML='<section class="intro"><div><div class="eyebrow">PER · LUCES Y MARCAS</div><h1>Entiende las luces.<br><em>Navega con criterio.</em></h1><p>Consulta las señales de las reglas 20, 21 y 23–31: variantes por eslora, arrancada, fondeo y operación.</p></div><span class="badge">● CATÁLOGO AMPLIADO · PER</span></section><section class="hero"><div class="hero-copy"><div class="eyebrow">ENTRENA LA MIRADA Y EL CRITERIO</div><h2>De una luz aislada<br>a una operación especial.</h2><p>Luces desde ocho direcciones, marcas diurnas y preguntas sobre las reglas y sus excepciones.</p><button class="primary" id="hero-start">Empezar a practicar <span>↗</span></button></div>'+scene(data.find(d=>d.id==='ram-stop'))+'</section><div class="kind-tabs" role="group" aria-label="Contenido del catálogo">'+Object.entries(kindNames).map(([k,n])=>'<button class="chip '+(contentKind===k?'selected':'')+'" data-kind="'+k+'">'+n+' <span>'+data.filter(d=>d.kind===k).length+'</span></button>').join('')+'</div><div class="toolbar"><label class="search"><input id="search" placeholder="⌕ Buscar buque, señal o regla…" aria-label="Buscar señales"></label><div class="filters">'+['Todos',...categories].map(c=>'<button class="chip '+(filter===c?'selected':'')+'" data-filter="'+c+'">'+c+'</button>').join('')+'</div></div><div class="section-head"><h2>'+kindNames[contentKind]+'</h2><span id="count"></span></div><div class="grid" id="cards"></div>'+coverage()+note();
 $('#search').value=query;$('#hero-start').onclick=()=>navigate('practice');$('#search').oninput=e=>{query=e.target.value;cards()};
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));cards()});
 document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{contentKind=b.dataset.kind;if(!data.some(d=>d.kind===contentKind&&d.cat===filter))filter='Todos';guide()});cards();
}

function cards(){
 const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const list=data.filter(d=>d.kind===contentKind&&(filter==='Todos'||d.cat===filter)&&norm(d.name+' '+d.sub+' '+d.desc+' regla '+d.rule+' '+d.clause).includes(norm(query)));
 $('#count').textContent=list.length+' fichas';
 $('#cards').innerHTML=list.map(d=>'<button class="card" data-id="'+d.id+'">'+scene(d)+'<div class="card-body"><div class="eyebrow">'+d.cat+' / REGLA '+d.rule+'</div><h3>'+d.name+'</h3><p>'+d.sub+'</p><div class="card-bottom"><span>Ver señal y explicación</span><span>↗</span></div></div></button>').join('')||'<div class="empty">No hay coincidencias. Prueba otra categoría o busca por número de regla.</div>';
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(data.find(d=>d.id===b.dataset.id)));
}

function detail(d){
 const el=$('#detail');el.innerHTML='<button class="close" aria-label="Cerrar">×</button><div class="eyebrow">'+kindNames[d.kind]+' · REGLA '+d.rule+' '+d.clause+'</div><h2>'+d.name+'</h2><p>'+d.sub+'</p><div id="detail-scene">'+scene(d)+'</div>'+(d.kind==='lights'?'<label class="small">Punto de observación<select class="detail-view" id="view">'+['proa','babor','estribor','popa'].map(v=>'<option '+(v===d.view?'selected':'')+' value="'+v+'">'+v[0].toUpperCase()+v.slice(1)+'</option>').join('')+'</select></label>':'')+'<p>'+d.desc+'</p>'+(d.kind==='lights'?'<p class="small">Tope: 225°. Costados: 112,5° cada uno. Alcance y remolque: 135°. Todo horizonte: 360°. Los centelleos se distinguen de las luces fijas; el resplandor de cubierta no representa una luz adicional de navegación.</p>':'')+'<p><a href="'+BOE+'#regla'+d.rule+'" target="_blank" rel="noopener">Consultar regla '+d.rule+' '+d.clause+' en el BOE ↗</a></p><button id="train-this" class="primary">Practicar esta categoría ↗</button>'+note();
 el.querySelector('.close').onclick=()=>el.close();if($('#view'))$('#view').onchange=e=>$('#detail-scene').innerHTML=scene(d,e.target.value);
 $('#train-this').onclick=()=>{el.close();contentKind=d.kind;navigate('practice');$('#category').value=d.cat;$('#practice-kind').value=d.kind};el.showModal();
}

function navigate(p){page=p;session=null;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));p==='guide'?guide():setup();window.scrollTo(0,0)}
function setup(){
 $('#app').innerHTML='<div class="practice-wrap"><div class="eyebrow">PER · PRÁCTICA</div><h1>Una señal.<br><em>Una nueva certeza.</em></h1><p>Elige luces, marcas diurnas o reglas y excepciones. Cada respuesta incluye su explicación.</p><div class="stats"><div><strong>'+stats.total+'</strong><span>Respuestas</span></div><div><strong>'+(stats.total?Math.round(stats.correct/stats.total*100):0)+'%</strong><span>Aciertos</span></div><div><strong>'+stats.sessions+'</strong><span>Sesiones</span></div></div><section class="setup"><h2>Prepara tu sesión</h2><div class="settings"><label>Contenido<select id="practice-kind">'+Object.entries(kindNames).map(([k,n])=>'<option value="'+k+'" '+(k===contentKind?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>Categoría<select id="category"><option>Todas</option>'+categories.map(c=>'<option>'+c+'</option>').join('')+'</select></label><label>Preguntas<select id="length"><option value="5">5 preguntas</option><option value="10" selected>10 preguntas</option><option value="20">20 preguntas</option><option value="40">40 preguntas</option></select></label></div><p class="small">En luces: ocho sectores de observación sin indicar desde dónde miras ni el estado del buque. Una sola opción compatible entre las cuatro. Las marcas se muestran como esquemas diurnos. El progreso se guarda en este dispositivo.</p><p id="session-error" role="status"></p><button id="begin" class="primary">Comenzar sesión ↗</button><div id="install-area" class="small"><p>Instala desde el menú del navegador. En Android: Chrome → Instalar aplicación. Espera a «Disponible sin conexión» antes de salir sin cobertura.</p></div></section>'+coverage()+note()+'</div>';
 $('#begin').onclick=()=>start($('#category').value,Number($('#length').value),$('#practice-kind').value);
 $('#practice-kind').onchange=()=>{if($('#practice-kind').value==='theory')$('#category').value='Todas'};
 if(installPrompt){$('#install-area').innerHTML='<p><button class="secondary" id="install">Instalar Farol</button></p>';$('#install').onclick=async()=>{await installPrompt.prompt();installPrompt=null}}
}

function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function start(cat,n,kind=contentKind){
 const source=practiceCandidates(cat,kind);if(!source.length){$('#session-error').textContent='No hay fichas de este contenido en esa categoría. Elige «Todas» u otro contenido.';return}
 const candidates=source.flatMap(d=>kind==='lights'?bearings.filter(a=>visibleLights(d,a).length>0).map(bearing=>({...d,bearing})): [{...d,bearing:d.kind==='marks'?d.view:0}]);
 const count=Math.min(n,candidates.length);const questions=shuffle(candidates).slice(0,count);
 session={questions,i:0,score:0,errors:[],answered:false};question();
}

function question(){
 const s=session;if(s.i>=s.questions.length)return finish();s.answered=false;const d=s.questions[s.i];Object.assign(s,makeQuestionOptions(d,d.bearing));
 const title=d.kind==='theory'?d.prompt:d.kind==='marks'?'¿Cuál de estas configuraciones es compatible con las marcas?':'¿Cuál de estas configuraciones es compatible con las luces?';
 $('#app').innerHTML='<div class="practice-wrap"><div class="row"><span class="eyebrow">'+kindNames[d.kind]+' · '+(s.i+1)+' DE '+s.questions.length+'</span><button class="secondary" id="exit">Salir</button></div><div class="progress"><div style="width:'+s.i/s.questions.length*100+'%"></div></div><h2>'+title+'</h2><p class="small">'+(d.kind==='theory'?'Elige la respuesta que se ajusta al RIPA.':'Elige la configuración compatible entre las cuatro opciones.')+'</p>'+(d.kind!=='theory'?'<div class="question-scene">'+scene(d,d.bearing,true)+'</div>':'')+'<div class="answers">'+s.options.map((x,i)=>'<button class="answer" data-answer="'+x.id+'">'+String.fromCharCode(65+i)+'. &nbsp;'+x.name+'</button>').join('')+'</div><div aria-live="polite" id="feedback"></div><p class="small">Esquemas didácticos. Una señal puede ser compatible con varias situaciones reales; los distractores de esta pregunta se eligen entre configuraciones incompatibles del catálogo.</p></div>';
 $('#exit').onclick=()=>navigate('practice');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));window.requestAnimationFrame(()=>window.scrollTo(0,0));
}

function answer(id){
 const s=session;if(s.answered)return;s.answered=true;const d=s.questions[s.i],ok=id===s.expected;stats.total++;if(ok){s.score++;stats.correct++}else s.errors.push(d);save();
 document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;b.classList.toggle('correct',b.dataset.answer===s.expected);b.classList.toggle('wrong',b.dataset.answer===id&&!ok)});
 const alternatives=s.matches.filter(x=>x.id!==d.id);
 const explanation=d.desc+(alternatives.length?'<br><br>Otras configuraciones compatibles del catálogo: '+alternatives.slice(0,7).map(x=>x.name).join('; ')+(alternatives.length>7?'; y '+(alternatives.length-7)+' más':'')+'. Entre las cuatro opciones solo se ofrece una compatible.':'');
 $('#feedback').innerHTML='<div class="feedback"><strong>'+(ok?'✓ Correcto':'Revisa esta señal')+' · '+(d.kind==='theory'?d.correct:d.name)+'</strong><p>'+explanation+'</p><p class="small"><a href="'+BOE+'#regla'+d.rule+'" target="_blank" rel="noopener">RIPA · Regla '+d.rule+' '+d.clause+' ↗</a></p></div><button class="primary" id="next">'+(s.i===s.questions.length-1?'Ver resultado':'Siguiente pregunta')+' →</button>';
 $('#next').onclick=()=>{s.i++;question()};
}

function finish(){window.requestAnimationFrame(()=>window.scrollTo(0,0));stats.sessions++;save();let s=session;$('#app').innerHTML=`<div class="practice-wrap"><div class="eyebrow">SESIÓN COMPLETADA</div><h1>${s.score} de ${s.questions.length}.<br><em>Sigue afinando tu mirada.</em></h1><p>${s.errors.length?'Repasa estas configuraciones y vuelve a probar.':'Has reconocido todas las configuraciones de esta sesión.'}</p><div class="stats"><div><strong>${Math.round(s.score/s.questions.length*100)}%</strong><span>Aciertos en esta sesión</span></div></div>${s.errors.length?`<div class="setup"><h2>Para repasar</h2>${s.errors.map(d=>`<p><button class="secondary review" data-review="${d.id}">${d.name} · Regla ${d.rule} ↗</button></p>`).join('')}</div>`:''}<p><button class="primary" id="again">Nueva sesión ↗</button> ${s.errors.length?'<button class="secondary" id="retry">Repetir fallos</button>':''}</p>${note()}</div>`;$('#again').onclick=setup;if($('#retry'))$('#retry').onclick=()=>{session={questions:shuffle(s.errors),i:0,score:0,errors:[],answered:false};question()};document.querySelectorAll('.review').forEach(b=>b.onclick=()=>detail(data.find(d=>d.id===b.dataset.review)))}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('.brand').onclick=e=>{e.preventDefault();navigate('guide')};$('#night').onclick=()=>{document.body.classList.toggle('night');try{localStorage.setItem('farol-night',document.body.classList.contains('night'))}catch{}};try{if(localStorage.getItem('farol-night')==='true')document.body.classList.add('night')}catch{};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(page==='practice'&&!session)setup()});guide();if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('#connection').textContent='● Disponible sin conexión'}).catch(()=>{$('#connection').textContent='○ Sin conexión aún no disponible'})}else $('#connection').textContent='○ Navegador sin soporte sin conexión';
</script></body></html>
