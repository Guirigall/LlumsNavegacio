ckground:var(--accent);color:#21372b;padding:12px 20px;border-radius:5px;font-weight:600}.primary span{margin-left:25px}.scene{position:relative;display:flex;align-items:center;justify-content:center;min-height:177px;background:radial-gradient(ellipse at 50% 100%,#1b3741,transparent 70%),#0a1c26}.scene:after{content:'';position:absolute;bottom:30px;left:8%;right:8%;border-top:1px solid #2a414b}.scene svg{width:100%;height:180px;max-width:340px}.hero .scene svg{height:245px}.scene-label{position:absolute;bottom:11px;color:#8fa3aa;font-size:9px;letter-spacing:2px}.toolbar{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px}.search{max-width:400px;flex:1}.search input{background:var(--paper);color:var(--ink);border:1px solid var(--line);width:100%;padding:13px 16px;border-radius:5px}.filters{display:flex;flex-wrap:wrap;gap:8px}.chip{background:none;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:9px 14px;font-size:12px}.chip.selected{background:var(--ink);color:var(--bg);border-color:var(--ink)}.section-head,.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.section-head{margin-bottom:18px}.section-head h2{font-size:17px;margin:0}.section-head span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:0;overflow:hidden;text-align:left;color:var(--ink);transition:transform .2s}.card:hover{transform:translateY(-3px)}.card-body{padding:19px 20px}.card h3{font-size:16px;margin:8px 0 6px}.card p{font-size:12px;margin:0}.card .eyebrow{font-size:9px}.card-bottom{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:18px}.note{border-top:1px solid var(--line);margin-top:30px;padding-top:18px;font-size:12px;color:var(--muted)}a{color:inherit}footer{padding:24px 5%;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:var(--muted)}dialog{background:var(--bg);color:var(--ink);border:0;border-radius:12px;width:min(680px,94vw);max-height:90vh;overflow:auto;padding:28px}dialog::backdrop{background:#06141cbb}.close{float:right;font-size:25px;background:none;border:0;color:var(--ink)}.detail-view{width:100%;padding:10px;background:var(--paper);color:var(--ink);border:1px solid var(--line);margin:12px 0}.legend{display:flex;gap:18px;justify-content:center;font-size:11px}.dot{display:inline-block;border-radius:50%;width:8px;height:8px;margin-right:5px}.practice-wrap{max-width:820px;margin:auto}.setup{background:var(--paper);border:1px solid var(--line);padding:28px;border-radius:10px}.settings{display:flex;gap:20px;margin:25px 0}.settings label{flex:1;font-size:12px}.settings select{display:block;width:100%;padding:12px;margin-top:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px}.stats{display:flex;gap:40px;margin:25px 0}.stats strong{font:30px Georgia;display:block}.stats span{font-size:12px;color:var(--muted)}.progress{height:4px;background:var(--line);margin:20px 0}.progress div{height:100%;background:#819c50}.question-scene{border-radius:10px;overflow:hidden}.question-scene .scene{min-height:255px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.answer{border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:left;padding:18px;border-radius:6px}.answer.correct{background:#e5efd9;color:#27401c;border-color:#6d8b48}.answer.wrong{background:#f8e4e1;color:#7f2828;border-color:#bb6464}.answer:disabled{opacity:1;cursor:default}.feedback{padding:18px;border:1px solid var(--line);border-radius:7px;margin:20px 0}.feedback p{margin:5px 0}.secondary{padding:11px 16px;background:none;border:1px solid var(--line);border-radius:5px;color:var(--ink)}.small{font-size:12px}.empty{padding:40px;text-align:center;grid-column:1/-1}.night{--bg:#101c22;--paper:#17272e;--ink:#d6d8c7;--mu </style><title>Farol · Luces de navegación</title></head><body><header><a class="brand" href="#">✳ farol <small>CUADERNO DE<br>NAVEGACIÓN</small></a><nav><button data-page="guide" class="active">Consultar</button><button data-page="practice">Practicar ↗</button></nav><button id="night">◐ <span>Modo nocturno</span></button></header><main id="app"></main><footer><span>FAROL &nbsp; / &nbsp; Aprende. Reconoce. Navega.</span><span id="connection">● Preparando modo sin conexión</span></footer><dialog id="detail"></dialog><script>const $=s=>document.querySelector(s);const colors={R:'#ff5559',G:'#5ef09b',W:'#fff5d8',Y:'#ffdc67'};
const data=[
['motor','Buque a motor','En navegación · menos de 50 m','Motor',23,['W'],'Luz de tope blanca, luces de costado y luz de alcance. En buques de 50 m o más es obligatoria una segunda luz de tope, a popa y más alta.','proa',true],
['vela','Buque de vela','En navegación · solo a vela','Vela',25,[],'Luces de costado y de alcance. Puede llevar, además, roja sobre verde en el tope; no junto con la linterna tricolor combinada. Si utiliza el motor, se considera buque de propulsión mecánica.','proa',true],
['nuc','Sin gobierno','Sin arrancada','Especiales',27,['R','R'],'Dos luces rojas todo horizonte en vertical. Si lleva arrancada, añade luces de costado y alcance. Sin gobierno significa que una circunstancia excepcional le impide maniobrar como exige el Reglamento.','proa',false],
['ram','Maniobra restringida','Sin arrancada · no fondeado','Especiales',27,['R','W','R'],'Roja, blanca y roja todo horizonte en vertical. Con arrancada añade tope, costados y alcance; fondeado, añade las luces de fondeo. Existen señales adicionales para operaciones específicas.','proa',false],
['trawl','Pesca de arrastre','Faenando · sin arrancada','Pesca',26,['G','W'],'Verde sobre blanca, ambas todo horizonte. Con arrancada añade costados y alcance. A partir de 50 m debe llevar un tope blanco a popa y más alto que la verde; por debajo de 50 m es opcional.','proa',false],
['fish','Pesca no de arrastre','Faenando · sin arrancada','Pesca',26,['R','W'],'Roja sobre blanca todo horizonte. Con arrancada añade costados y alcance. Si el aparejo se extiende más de 150 m horizontalmente, añade una blanca todo horizonte en dirección al aparejo.','proa',false],
['pilot','Buque de práctico','En servicio · en navegación','Especiales',29,['W','R'],'Blanca sobre roja todo horizonte. En navegación añade costados y alcance; fondeado añade las luces de fondeo. Estas señales corresponden al servicio de practicaje.','proa',true],
['draft','Restringido por su calado','En navegación · señal facultativa','Especiales',28,['R','R','R'],'Puede exhibir tres rojas todo horizonte en vertical, además de las luces de un buque a motor de la regla 23. Esta categoría pertenece al Reglamento internacional.','proa',true],
['anchor','Buque fondeado','Menos de 50 m · disposición simplificada','Fondeo',30,['W'],'Un buque de menos de 50 m puede mostrar una sola blanca todo horizonte donde mejor se vea. La disposición general es una blanca a proa y otra a popa más baja. Existen excepciones para ciertas embarcaciones pequeñas.','proa',false],
['ground','Buque varado','Menos de 50 m · 12 m o más','Fondeo',30,['R','R'],'Luces de fondeo más dos rojas todo horizonte en vertical. El esquema muestra una blanca de fondeo separada. Los buques de menos de 12 m no están obligados a las dos rojas de varado.','proa',false],
['tow','Remolcador · hasta 200 m','Remolque de hasta 200 m','Motor',24,['W','W'],'Dos luces de tope en vertical, costados, alcance y luz amarilla de remolque encima de la de alcance. La longitud se mide desde la popa del remolcador hasta el extremo del remolque.','proa',true],
['towlong','Remolcador · más de 200 m','Remolque de más de 200 m','Motor',24,['W','W','W'],'Tres luces de tope en vertical, costados, alcance y amarilla de remolque sobre el alcance. Añade una marca bicónica de día. El objeto remolcado lleva sus señales correspondientes.','proa',true],
['stern','Buque visto por la popa','Solo luz de alcance visible','Básicas',21,[],'La luz de alcance es blanca y cubre 135°, centrados hacia popa. Una blanca aislada no permite concluir por sí sola que sea un buque fondeado: hay que valorar el contexto y el movimiento.','popa',true],
['small','Buque a motor pequeño','Menos de 12 m · alternativa','Motor',23,['W'],'Puede mostrar una blanca todo horizonte y luces de costado en lugar del conjunto de tope y alcance. No debe confundirse con la disposición de un buque fondeado.','proa',true]
].map(([id,name,sub,cat,rule,stack,desc,view,sides])=>({id,name,sub,cat,rule,stack,desc,view,sides}));
let page='guide',filter='Todos',query='',session=null,installPrompt;let stats;try{stats=JSON.parse(localStorage.getItem('farol-stats'))||{total:0,correct:0,sessions:0};if(!Number.isFinite(stats.total))throw 0}catch{stats={total:0,correct:0,sessions:0}}
function save(){try{localStorage.setItem('farol-stats',JSON.stringify(stats))}catch{}}
function light(x,y,c){return `<circle cx="${x}" cy="${y}" r="12" fill="${colors[c]}" opacity=".07"/><circle cx="${x}" cy="${y}" r="7" fill="${colors[c]}" opacity=".15"/><circle cx="${x}" cy="${y}" r="3.7" fill="${colors[c]}"/>`}
const bearings=[0,45,90,135,180,225,270,315];
const viewAngles={proa:0,estribor:90,popa:180,babor:270};
function visibleLights(d,view=d.view){
  const angle=typeof view==='number'?((view%360)+360)%360:viewAngles[view];
  const forward=angle<112.5||angle>247.5, aft=angle>112.5&&angle<247.5;
  const all=['nuc','ram','trawl','fish','pilot','draft','anchor','ground','small'].includes(d.id);
  const lights=[];const add=(x,y,c)=>lights.push({x,y,c});
  if(all||forward)d.stack.forEach((c,i)=>add(160,40+i*23,c));
  if(d.id==='draft'&&forward)add(195,66,'W');
  if(d.id==='ground')add(210,92,'W');
  if(d.sides){
    if(angle===0){add(115,132,'G');add(205,132,'R')}
    else if(forward)add(160,132,angle<180?'G':'R');
    if(aft&&d.id!=='small'){add(160,132,'W');if(d.id.startsWith('tow'))add(160,108,'Y')}
  }
  return lights;
}
function lightSignature(d,view){
  const lights=visibleLights(d,view);const minX=Math.min(...lights.map(l=>l.x)),minY=Math.min(...lights.map(l=>l.y));
  return lights.map(l=>[l.x-minX,l.y-minY,l.c].join(',')).sort().join('|');
}
function scene(d,view=d.view,practice=false){
  const lights=visibleLights(d,view);const label={proa:'VISTA DE PROA',popa:'VISTA DE POPA',babor:'COSTADO DE BABOR',estribor:'COSTADO DE ESTRIBOR'}[view]||'';
  const colorNames={R:'roja',G:'verde',W:'blanca',Y:'amarilla'};
  const desc=practice?'Luces observadas: '+lights.map(l=>colorNames[l.c]).join(', '):'Esquema luminoso. '+label.toLowerCase();
  return '<div class="scene"><svg viewBox="0 0 320 180" role="img" aria-label="'+desc+'">'+(practice?'':'<path d="M125 145 Q160 164 195 145 L187 151 Q160 169 133 151Z" fill="#233b45"/><path d="M160 139V28" stroke="#233b45" stroke-width="1"/>')+lights.map(l=>light(l.x,l.y,l.c)).join('')+'</svg>'+(practice?'':'<span class="scene-label">'+label+'</span>')+'</div>';
}
function note(){return `<div class="note">Esquemas didácticos simplificados, no a escala. Ayuda de consulta: no sustituye al RIPA, la vigilancia ni la valoración del riesgo de abordaje. Una luz aislada puede ser ambigua. <a href="https://www.imo.org/en/about/conventions/pages/colreg.aspx" target="_blank" rel="noopener">COLREG / OMI ↗</a> · <a href="https://www.navcen.uscg.gov/navigation-rules-amalgamated" target="_blank" rel="noopener">Reglas 20–31 / USCG ↗</a>. Se usa el régimen internacional, no las reglas interiores de EE. UU.</div>`}
function guide(){ $('#app').innerHTML=`<section class="intro"><div><div class="eyebrow">EL MAR TAMBIÉN TIENE SU LENGUAJE</div><h1>Entiende las luces.<br><em>Navega con criterio.</em></h1><p>Tu guía de luces de navegación: consulta una señal al instante o entrena tu mirada antes de salir al mar.</p></div><span class="badge">● RIPA · REGLAS INTERNACIONALES</span></section><section class="hero"><div class="hero-copy"><div class="eyebrow">UN POCO DE PRÁCTICA. MÁS CONFIANZA.</div><h2>¿Qué te están diciendo<br>esas luces?</h2><p>Observa, elige y aprende. Sesiones cortas con una explicación después de cada respuesta.</p><button class="primary" id="hero-start">Empezar a practicar <span>↗</span></button></div>${scene(data[3])}</section><div class="toolbar"><label class="search"><input id="search" placeholder="⌕  Buscar buque, luz o situación…" aria-label="Buscar luces" value="${query}"></label><div class="filters">${['Todos','Motor','Vela','Pesca','Especiales','Fondeo','Básicas'].map(c=>`<button class="chip ${filter===c?'selected':''}" data-filter="${c}">${c}</button>`).join('')}</div></div><div class="section-head"><h2>Biblioteca de luces</h2><span id="count"></span></div><div class="grid" id="cards"></div>${note()}`;$('#hero-start').onclick=()=>navigate('practice');$('#search').oninput=e=>{query=e.target.value;cards()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));cards()});cards()}
function cards(){let norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let list=data.filter(d=>(filter==='Todos'||d.cat===filter)&&norm(d.name+' '+d.sub+' '+d.desc+' regla '+d.rule).includes(norm(query)));$('#count').textContent=`${list.length} configuraciones`;$('#cards').innerHTML=list.map(d=>`<button class="card" data-id="${d.id}">${scene(d)}<div class="card-body"><div class="eyebrow">${d.cat} / REGLA ${d.rule}</div><h3>${d.name}</h3><p>${d.sub}</p><div class="card-bottom"><span>Ver luces y significado</span><span>↗</span></div></div></button>`).join('')||'<div class="empty">No hay coincidencias. Prueba con «pesca», «roja» o «regla 27».</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(data.find(d=>d.id===b.dataset.id)))}
function detail(d){let el=$('#detail');el.innerHTML=`<button class="close" aria-label="Cerrar">×</button><div class="eyebrow">RIPA · REGLA ${d.rule}</div><h2>${d.name}</h2><p>${d.sub}</p><div id="detail-scene">${scene(d)}</div><label class="small">Punto de observación<select class="detail-view" id="view">${['proa','babor','estribor','popa'].map(v=>`<option ${v===d.view?'selected':''} value="${v}">${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></label><div class="legend"><span><i class="dot" style="background:#ef5656"></i>Roja</span><span><i class="dot" style="background:#35bf7d"></i>Verde</span><span><i class="dot" style="background:#c6bd9e"></i>Blanca</span></div><p>${d.desc}</p><p class="small">Los costados se nombran desde el propio buque. Al verlo de proa, su verde queda a tu izquierda. Los sectores de tope (225°), costados (112,5° cada uno) y alcance (135°) determinan qué luces ves.</p><button id="train-this" class="primary">Practicar esta categoría ↗</button>${note()}`;el.querySelector('.close').onclick=()=>el.close();$('#view').onchange=e=>$('#detail-scene').innerHTML=scene(d,e.target.value);$('#train-this').onclick=()=>{el.close();navigate('practice');$('#category').value=d.cat};el.showModal()}
function navigate(p){page=p;session=null;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));p==='guide'?guide():setup();window.scrollTo(0,0)}
function setup(){$('#app').innerHTML=`<div class="practice-wrap"><div class="eyebrow">ENTRENA TU MIRADA</div><h1>Una señal.<br><em>Una nueva certeza.</em></h1><p>Identifica el buque a partir de sus luces. Recibirás una explicación en cada pregunta.</p><div class="stats"><div><strong>${stats.total}</strong><span>Respuestas</span></div><div><strong>${stats.total?Math.round(stats.correct/stats.total*100):0}%</strong><span>Aciertos</span></div><div><strong>${stats.sessions}</strong><span>Sesiones</span></div></div><section class="setup"><h2>Prepara tu sesión</h2><div class="settings"><label>Categoría<select id="category"><option>Todas</option>${['Motor','Vela','Pesca','Especiales','Fondeo','Básicas'].map(c=>`<option>${c}</option>`).join('')}</select></label><label>Preguntas<select id="length"><option value="5">5 preguntas</option><option value="10" selected>10 preguntas</option><option value="14">14 preguntas</option></select></label></div><p class="small">Luces desde proa, popa, costados y ambas aletas y amuras, sin pistas del punto de observación ni del estado del buque. Algunas configuraciones admiten varias interpretaciones. Tu progreso se guarda en este dispositivo.</p><button id="begin" class="primary">Comenzar sesión ↗</button><div id="install-area" class="small"><p>Instala Farol desde el menú del navegador → Instalar aplicación o Añadir a pantalla de inicio. En iPhone: Safari → Compartir → Añadir a pantalla de inicio. Abre la app con conexión una vez y espera a «Disponible sin conexión».</p></div></section>${note()}</div>`;$('#begin').onclick=()=>start($('#category').value,Number($('#length').value));if(installPrompt){$('#install-area').innerHTML='<p><button class="secondary" id="install">Instalar Farol</button></p>';$('#install').onclick=async()=>{await installPrompt.prompt();installPrompt=null}}}
function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function start(cat,n){
  const pool=data.filter(d=>d.id!=='stern'&&(cat==='Todas'||d.cat===cat));
  // The basic-light category uses actual ships seen from their stern sector.
  const source=cat==='Básicas'?data.filter(d=>['motor','vela','small'].includes(d.id)):pool;
  const count=Math.min(n,source.length*bearings.length);const deck=[];
  let angles=shuffle(bearings);
  for(let i=0;i<count;i++){
    if(i%source.length===0)deck.push(...shuffle(source));
  }
  const questions=deck.slice(0,count).map((d,i)=>({...d,bearing:cat==='Básicas'?shuffle([135,180,225])[i%3]:angles[i%angles.length]}));
  session={questions,i:0,score:0,errors:[],answered:false};question();
}
function question(){
  const s=session;if(s.i>=s.questions.length)return finish();s.answered=false;const d=s.questions[s.i];
  const signature=lightSignature(d,d.bearing);
  const matches=data.filter(x=>bearings.some(angle=>(x.id!=='stern'||[135,180,225].includes(angle))&&lightSignature(x,angle)===signature));
  const ambiguous=matches.length>1;s.matches=matches;s.expected=ambiguous?'ambiguous':d.id;
  const interpretation={id:s.expected,name:ambiguous?'No se puede determinar un único tipo con estas luces':d.name};
  const distractors=shuffle(data.filter(x=>x.id!==d.id&&x.id!=='stern')).slice(0,3);
  const opts=shuffle([interpretation,...distractors]);
  $('#app').innerHTML='<div class="practice-wrap"><div class="row"><span class="eyebrow">PRÁCTICA · '+(s.i+1)+' DE '+s.questions.length+'</span><button class="secondary" id="exit">Salir</button></div><div class="progress"><div style="width:'+s.i/s.questions.length*100+'%"></div></div><h2>¿Qué puedes identificar con estas luces?</h2><p class="small">Observa solo las luces. Si varias configuraciones del catálogo son compatibles, elige la respuesta que reconoce esa incertidumbre.</p><div class="question-scene">'+scene(d,d.bearing,true)+'</div><div class="answers">'+opts.map((x,i)=>'<button class="answer" data-answer="'+x.id+'">'+String.fromCharCode(65+i)+'. &nbsp;'+x.name+'</button>').join('')+'</div><div aria-live="polite" id="feedback"></div><p class="small">No se muestra el ángulo ni la condición del buque. Esquema didáctico: las luces por sí solas no siempre bastan para identificarlo.</p></div>';
  $('#exit').onclick=()=>navigate('practice');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));
}
function answer(id){
  const s=session;if(s.answered)return;s.answered=true;const d=s.questions[s.i],ok=id===s.expected;stats.total++;
  if(ok){s.score++;stats.correct++}else s.errors.push(d);save();
  document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;b.classList.toggle('correct',b.dataset.answer===s.expected);b.classList.toggle('wrong',b.dataset.answer===id&&!ok)});
  const ambiguous=s.expected==='ambiguous';
  const explanation=ambiguous?'Estas luces son compatibles con varias configuraciones del catálogo: '+s.matches.map(x=>x.name).join('; ')+'. No permiten elegir una sola de ellas sin información adicional. Valora el movimiento relativo, la evolución de las luces y el contexto.':d.desc;
  $('#feedback').innerHTML='<div class="feedback"><strong>'+(ok?'✓ Correcto':'Revisa esta señal')+' · '+(ambiguous?'Identificación no concluyente':d.name)+'</strong><p>'+explanation+'</p><p class="small">'+(ambiguous?'Los sectores de visibilidad pueden ocultar las luces que distinguen unos buques de otros. RIPA · Regla 21.':'RIPA · Regla '+d.rule)+'</p></div><button class="primary" id="next">'+(s.i===s.questions.length-1?'Ver resultado':'Siguiente pregunta')+' →</button>';
  $('#next').onclick=()=>{s.i++;question()};
}
function finish(){stats.sessions++;save();let s=session;$('#app').innerHTML=`<div class="practice-wrap"><div class="eyebrow">SESIÓN COMPLETADA</div><h1>${s.score} de ${s.questions.length}.<br><em>Sigue afinando tu mirada.</em></h1><p>${s.errors.length?'Repasa estas configuraciones y vuelve a probar.':'Has reconocido todas las configuraciones de esta sesión.'}</p><div class="stats"><div><strong>${Math.round(s.score/s.questions.length*100)}%</strong><span>Aciertos en esta sesión</span></div></div>${s.errors.length?`<div class="setup"><h2>Para repasar</h2>${s.errors.map(d=>`<p><button class="secondary review" data-review="${d.id}">${d.name} · Regla ${d.rule} ↗</button></p>`).join('')}</div>`:''}<p><button class="primary" id="again">Nueva sesión ↗</button> ${s.errors.length?'<button class="secondary" id="retry">Repetir fallos</button>':''}</p>${note()}</div>`;$('#again').onclick=setup;if($('#retry'))$('#retry').onclick=()=>{session={questions:shuffle(s.errors),i:0,score:0,errors:[],answered:false};question()};document.querySelectorAll('.review').forEach(b=>b.onclick=()=>detail(data.find(d=>d.id===b.dataset.review)))}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('.brand').onclick=e=>{e.preventDefault();navigate('guide')};$('#night').onclick=()=>{document.body.classList.toggle('night');try{localStorage.setItem('farol-night',document.body.classList.contains('night'))}catch{}};try{if(localStorage.getItem('farol-night')==='true')document.body.classList.add('night')}catch{};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(page==='practice'&&!session)setup()});guide();if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('#connection').textContent='● Disponible sin conexión'}).catch(()=>{$('#connection').textContent='○ Sin conexión aún no disponible'})}else $('#connection').textContent='○ Navegador sin soporte sin conexión';
</script></body></html>
